name: Build Bahar AI IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup project
        run: |
          ls -la
          unzip -o "*.zip" -d . 2>/dev/null || true
          if [ -d "BaharAI_Xcode_Project" ]; then
            cp -R BaharAI_Xcode_Project/* . 2>/dev/null || true
            cp -R BaharAI_Xcode_Project/.* . 2>/dev/null || true
          fi
          find . -maxdepth 4 -name "*.xcodeproj" | head -5
          ls -la
      - name: Build IPA no signing
        run: |
          set -e
          PROJ=$(find . -maxdepth 4 -name "*.xcodeproj" | head -1)
          echo "Building $PROJ"
          xcodebuild -list -project "$PROJ" || true
          xcodebuild -project "$PROJ" -scheme BaharAI -configuration Release -sdk iphoneos -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP=$(find ./DerivedData -name "*.app" | head -1)
          echo "App found: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r BaharAI-AB-v1.1.0-UNSIGNED.ipa Payload
          ls -lh *.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaharAI-IPA-v1.1.0-AB
          path: BaharAI-AB-v1.1.0-UNSIGNED.ipa
          retention-days: 30
