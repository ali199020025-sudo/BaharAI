name: Build Bahar AI IPA
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o "*.zip" -d . || true
          if [ -d "BaharAI_Xcode_Project" ]; then mv BaharAI_Xcode_Project/* .; fi
      - name: Build IPA
        run: |
          PROJ=$(find . -name "*.xcodeproj" | head -1)
          xcodebuild -project "$PROJ" -scheme BaharAI -configuration Release -archivePath BaharAI.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R BaharAI.xcarchive/Products/Applications/BaharAI.app Payload/
          zip -r BaharAI-AB-v1.1.0.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BaharAI-IPA
          path: BaharAI-AB-v1.1.0.ipa
